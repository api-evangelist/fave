aid: fave
name: Fave
description: >-
  Fave is a Malaysia- and Singapore-based lifestyle and payments app offering
  deals, cashback, rewards, eCards, and QR-code payments, operated by Fave Asia
  Technologies and owned by Pine Labs. For merchants and platforms, Fave exposes
  the FavePay Omni (FPO) partner API: create single-use QR codes or payment URLs,
  process customer-presented (merchant-scan) charges, look up, list, and
  acknowledge transactions, issue full or partial refunds, and receive signed
  webhook callbacks on every status change. Every request is signed with
  HMAC-SHA256 using a secret key Fave issues during partner onboarding. FavePay
  Omni operates across Malaysia (MY), Singapore (SG), and Indonesia (ID).
